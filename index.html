<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-areas:
    "header header"
    "header2 header2"
    "menu content"
    "footer footer";
  grid-template-columns: 1fr 3fr;
  gap: 3px;
  background-color: black;
  padding: 5px;
}
.container div {
  background-color: #ccffcc;
  padding: 10px;
}
.container div.header {
    display: flex;
  grid-area: header;
  text-align: center;
}
.container div.header2 {
  grid-area: header2;
  text-align: center;
}
.container div.menu {
    display: flex;
    text-align: center;
    grid-area: menu;
}
.container div.gallery {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    overflow-x: scroll;
    width: 400px;
    height: 370px;
}
.container div.content {
  grid-area: content;
}
.container div.footer {
  grid-area: footer;
  text-align: center;  
}
.messagebox {
  width: 350px;
  padding: 80px;
  box-sizing: border-box;
}
</style>
</head>
<body>
    <div class="container">

    <div class="header"><img src="DMMMSU-Logo.png" width="100" height="100">
        <h1>Don Mariano Marcos Memorial State University</h1></div>
    <div class="header2" ><a href="home.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="Contact Us.html">Contact Us</a>
    </div>

    <div class="menu">
      <h2>Campus Notices</h2><br></br>

      <div class="gallery">
        <img src="asynch-upo26.jpeg" width="350" height="350">
        <img src="law-announcement.jpeg" width="350" height="350">
        <img src="mluc-enrolment.jpeg" width="350" height="350">
      </div>

    </div>

    <div class="content">
        <label for="Title"><h3 style="margin: 0 0 2px 0;">Title</h3></label>
        <input type="Title" id="Title" name="Title"><br></br>
        <label for="Message"><h3 style="margin: 0 0 2px 0;">Message</h3></label>
        <input type="Message" class="messagebox" id="Message" name="Message"><br></br>
        <button type="submit"><h5>Post Notice</h5></button><br></br>
        </label>
        </div>

    <div class="footer"><h2>College of Computer Science</h2></div>
</div>

</body>
</html>
